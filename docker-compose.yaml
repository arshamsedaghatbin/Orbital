version: '3.8'

services:
  # سرویس اصلی هوش مصنوعی
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped

  # سرویس خودکار برای دانلود مدل‌ها (Provisioner)
  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: ollama_provisioner
    volumes:
      - ./ollama_data:/root/.ollama
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama_service:11434  # این خط حیاتی است
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama to start...' &&
      sleep 10 &&
      echo 'Downloading Llama 3.2...' &&
      ollama pull llama3.2 &&
      echo 'Downloading Moondream (Vision)...' &&
      ollama pull moondream &&
      echo 'All models are ready!'"

  # ایجنت اصلی پروژه Orbital
  app:
    build: .
    container_name: signal_processor
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
    restart: on-failure
